<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --paper:#F0EDE3;
    --surface:#FAF8F0;
    --ink:#191B16;
    --ink2:#6C7064;
    --ink3:#9B9D90;
    --line:#DBD6C6;
    --line2:#E9E5D7;
    --navy:#24405A;
    --red:#A8402F;
    --serif:ui-serif,"New York","Songti SC","Source Han Serif SC",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);
    font:15px/1.55 var(--sans);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;color:inherit}
  input,textarea{font-family:inherit;color:inherit}
  ::selection{background:rgba(36,64,90,.16)}
  :focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:6px}

  /* ---------- 顶栏 ---------- */
  #top{
    position:sticky;top:0;z-index:20;display:flex;align-items:baseline;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 14px) 20px 8px;
    background:linear-gradient(var(--paper) 72%,rgba(240,237,227,0));
  }
  .brand{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.15em;line-height:1}
  .pill{font-size:12px;color:var(--ink2);letter-spacing:.04em;font-variant-numeric:tabular-nums}

  main{padding:2px 20px calc(150px + env(safe-area-inset-bottom))}

  /* ---------- 首页 ---------- */
  .hero{position:relative;padding:14px 0 0;margin-bottom:8px;overflow:hidden}
  .hero::after{
    content:"";position:absolute;right:-78px;top:-104px;width:260px;height:260px;border-radius:50%;
    background:repeating-radial-gradient(circle,rgba(36,64,90,.11) 0 1px,transparent 1px 7px);
    pointer-events:none;
  }
  .hero-k{font-size:12.5px;letter-spacing:.08em;color:var(--ink2)}
  .hero-num{
    position:relative;font-family:var(--serif);font-size:clamp(40px,13.2vw,54px);line-height:1.04;
    font-weight:600;letter-spacing:-.02em;margin:6px 0 16px;font-variant-numeric:tabular-nums;
  }
  .hero-num .cur{font-size:.4em;font-weight:400;color:var(--ink2);margin-right:.22em;vertical-align:.12em;letter-spacing:0}
  .hero-num .dec{font-size:.6em;color:var(--ink2)}
  .hero-num.neg{color:var(--red)}
  .bar{height:3px;background:rgba(25,27,22,.08);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .4s cubic-bezier(.32,.72,0,1)}
  .hero-foot{display:flex;justify-content:space-between;gap:12px;margin-top:9px;font-size:12.5px;color:var(--ink2)}
  .hero-foot b{font-weight:500;color:var(--ink);font-family:var(--serif);font-size:14px;font-variant-numeric:tabular-nums}

  .hint{
    display:block;width:100%;text-align:left;margin:20px 0 0;padding:11px 14px;border-radius:10px;
    background:rgba(36,64,90,.07);border:0;color:var(--navy);font-size:13px;line-height:1.4;
  }
  .hint b{font-variant-numeric:tabular-nums}

  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 2px}
  .sec-h h2{font-size:12.5px;font-weight:500;letter-spacing:.1em;color:var(--ink2);margin:0}
  .link{
    background:none;border:0;padding:8px 0 8px 14px;color:var(--navy);font-size:13px;margin:-8px 0;
  }

  .pocket{
    display:block;width:100%;touch-action:manipulation;text-align:left;background:none;border:0;
    border-top:1px solid var(--line);padding:14px 0 12px;
  }
  .pocket:last-child{border-bottom:1px solid var(--line)}
  .pocket:active{background:rgba(25,27,22,.04)}
  .pocket.gone{opacity:.6}
  .pk-top{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:12px}
  .pk-name{font-size:15.5px;font-weight:500;display:flex;align-items:center;gap:9px}
  .pk-name::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
  .pk-meta{font-size:12px;color:var(--ink3);margin-top:1px;font-variant-numeric:tabular-nums}
  .pk-amt{font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pk-amt.over{color:var(--red)}
  .pk-amt.zero{color:var(--ink3);font-weight:400}
  .pk-bar{height:3px;margin-top:9px;background:var(--line2);border-radius:2px;overflow:hidden}
  .pk-bar i{display:block;height:100%;background:var(--c);border-radius:2px;transition:width .4s cubic-bezier(.32,.72,0,1)}
  .pk-bar i.over{background:var(--red)}

  /* ---------- 存款 ---------- */
  .goal{
    display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);
    padding:14px 0 12px;
  }
  .goal:last-child{border-bottom:1px solid var(--line)}
  .goal:active{background:rgba(25,27,22,.04)}
  .g-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .g-name{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:500}
  .g-name::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
  .g-amt{font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .g-sub{display:block;font-size:12px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
  .g-bar{display:block;height:3px;margin-top:9px;background:var(--line2);border-radius:2px;overflow:hidden}

  .seg2{display:flex;gap:6px;margin:2px 0 16px}
  .seg2 button{flex:1;border:1px solid var(--line);background:none;border-radius:10px;padding:10px 0;font-size:14px;color:var(--ink2)}
  .seg2 button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 2px}
  .qchip{
    border:1px solid var(--line);background:none;border-radius:999px;padding:0 12px;min-height:34px;

  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:20px;border-bottom:1px solid var(--line)}

  /* ---------- 浮层 ---------- */
  #layer{
    position:fixed;left:0;top:0;width:100%;height:100%;z-index:60;
    display:flex;align-items:flex-end;justify-content:center;pointer-events:none;
  }
  #layer[hidden]{display:none}
  #backdrop{position:absolute;inset:0;background:rgba(25,27,22,.36);opacity:0;transition:opacity .22s;pointer-events:auto}
  #sheet{

  .grab{width:36px;height:4px;border-radius:3px;background:var(--line);margin:2px auto 16px}

  .amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ink);padding:2px 0 8px;margin:4px 0 20px}
  .amount .cur{font-family:var(--serif);font-size:26px;color:var(--ink2)}
  .amount input{

  .field{

  .income .cur{font-family:var(--serif);font-size:15px;color:var(--ink2)}
  .income input{

    font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  }
  .income input:focus{outline:none}
  .income input::placeholder{color:#C9C5B3;font-weight:400}

  .brow{display:grid;grid-template-columns:16px 1fr 88px 40px;align-items:center;gap:8px;padding:2px 0;border-bottom:1px solid var(--line2)}
  .brow .dot{width:14px;height:14px;border-radius:50%;border:0;background:var(--c);padding:0;margin:0 -1px}
  .brow .bname{border:0;background:none;padding:13px 0;font-size:16px;width:100%;min-width:0}
  .brow .bname:focus{outline:none;border-bottom:1px solid var(--ink)}
  .brow .bamt{display:flex;align-items:baseline;justify-content:flex-end;gap:3px}
  .brow .bamt .cur{font-family:var(--serif);font-size:13px;color:var(--ink3)}
  .brow .bval{
    width:62px;border:0;background:none;text-align:right;padding:13px 0;font-family:var(--serif);
    font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;
  }
  .brow .bval:focus{outline:none;border-bottom:1px solid var(--ink)}
  .brow .bdel{
    width:40px;height:40px;border:0;background:none;color:var(--ink3);font-size:20px;line-height:1;
    display:grid;place-items:center;margin-right:-8px;
  }
  .brow .bdel:active{color:var(--red)}
  .add-cat{
    display:block;width:100%;margin-top:8px;padding:13px 0;border:1px dashed var(--line);
    border-radius:10px;background:none;color:var(--ink2);font-size:13.5px;
  }
  .alloc{display:flex;justify-content:space-between;gap:10px;margin:18px 0 4px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .alloc b{font-family:var(--serif);font-size:14px;color:var(--ink);font-weight:600}
  .alloc b.over{color:var(--red)}

  .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btnrow .btn{margin-top:0}
  .code{
    width:100%;height:150px;border:1px solid var(--line);border-radius:10px;background:var(--paper);
    padding:10px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2);
    resize:none;margin:4px 0 14px;
  }
  .code:focus{outline:none;border-color:var(--navy)}
  .warn{font-size:12px;color:var(--red);margin:12px 0 0;line-height:1.5}

  #toast{
    position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:rgba(25,27,22,.94);color:#F7F5EC;font-size:13px;line-height:1.45;padding:11px 16px;
    border-radius:10px;max-width:min(340px,calc(100% - 44px));text-align:center;z-index:90;pointer-events:none;
    opacity:0;transition:opacity .2s,transform .2s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>

<body>

<header id="top">
  <div class="brand">月钱</div>
  <div class="pill" id="pill"></div>
</header>

<main id="view"></main>

<nav id="tabs">
  <button class="tab" data-act="tab" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3.5 8.2 12 3.5l8.5 4.7v10.3a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5V8.2Z"/><path d="m3.5 8.2 8.5 6 8.5-6"/></svg>
    本月
  </button>
  <button class="tab" data-act="tab" data-tab="bills">
    <svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-3-1.8-3 1.8-3-1.8-3 1.8v-17Z"/><path d="M9.2 8h5.6M9.2 12h5.6"/></svg>
    账单
  </button>
  <button class="tab" data-act="tab" data-tab="save">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6.6" rx="6.4" ry="2.6"/><path d="M5.6 6.6v5.2c0 1.44 2.86 2.6 6.4 2.6s6.4-1.16 6.4-2.6V6.6"/><path d="M5.6 11.8v5.2c0 1.44 2.86 2.6 6.4 2.6s6.4-1.16 6.4-2.6v-5.2"/></svg>
    存款
  </button>
  <button class="tab" data-act="tab" data-tab="settings">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/><circle cx="16.6" cy="15" r="1.1"/></svg>
    我的
  </button>
  <button class="tab act" id="logBtn" aria-label="记一笔">
    <span class="act-in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>记一笔</span>
  </button>
</nav>

<div id="layer" hidden>
  <div id="backdrop" data-act="close"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="操作面板"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ============ 基础工具 ============ */
const STORE_KEY = 'yueqian.v1';
const PALETTE = ['#3D6E52','#33587E','#7D5A3A','#A4483C','#64517F','#2C6D6B','#946B2A','#4A4F4A'];
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad2 = n => String(n).padStart(2, '0');
const ymdOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const monthOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1);
const NOW = new Date();
const TODAY = ymdOf(NOW);
const CUR_MONTH = monthOf(NOW);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmt(cents) {
  const a = Math.abs(Math.round(cents || 0));
  const whole = Math.floor(a / 100);
  const frac = a % 100;
  let s = whole.toLocaleString('en-US');
  if (frac) s += '.' + pad2(frac);
  return s;
}
function money(cents) {
  return (cents < 0 ? '-' : '') + '¥' + fmt(cents);
}
function parseMoney(v) {
  const t = String(v == null ? '' : v).replace(/[^\d.]/g, '');
  if (!t) return 0;
  const n = parseFloat(t);
  if (!isFinite(n)) return 0;
  return Math.round(n * 100);
}
function monthLabel(mk) {
  const p = mk.split('-');
  return p[0] + '年' + Number(p[1]) + '月';
}
function dayLabel(ymd) {
  const p = ymd.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  return p[1] + '月' + p[2] + '日 ' + WD[d.getDay()];
}
function esc2(c) { return /^#[0-9a-fA-F]{3,8}$/.test(c || '') ? c : '#4A4F4A'; }

/* ============ 数据 ============ */
function seedCats() {
  return [
    { id: 'c-food', name: '吃饭', color: PALETTE[0] },
    { id: 'c-fun', name: '娱乐活动', color: PALETTE[1] },
    { id: 'c-smoke', name: '买香烟', color: PALETTE[2] }
  ];
}

let db = { cats: [], months: {}, goals: [], saves: [] };
let storageOK = true;

function loadDB() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === 'object') {
        db.cats = Array.isArray(p.cats) ? p.cats : [];
        db.months = (p.months && typeof p.months === 'object') ? p.months : {};
        db.goals = Array.isArray(p.goals) ? p.goals : [];
        db.saves = Array.isArray(p.saves) ? p.saves : [];
      }
    }
  } catch (e) {
    storageOK = false;
  }
  if (!db.cats.length) db.cats = seedCats();
  normalizeDB();
}
function normalizeDB() {
  db.cats.forEach(c => { c.archived = !!c.archived; c.color = esc2(c.color); });
  db.goals = Array.isArray(db.goals) ? db.goals : [];
  db.saves = Array.isArray(db.saves) ? db.saves : [];
  db.goals.forEach(g => { g.archived = !!g.archived; g.color = esc2(g.color); g.target = g.target || 0; });
  db.saves = db.saves.filter(s => s && s.goalId && typeof s.amt === 'number');
  db.saves.forEach(s => { s.mk = s.mk || String(s.ymd || TODAY).slice(0, 7); s.ts = s.ts || 0; });
  Object.keys(db.months).forEach(k => {
    const m = db.months[k];
    if (!m || typeof m !== 'object') { delete db.months[k]; return; }
    m.income = m.income || 0;
    m.budget = (m.budget && typeof m.budget === 'object') ? m.budget : {};
    m.tx = Array.isArray(m.tx) ? m.tx : [];
  });
}
function saveDB() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(db));
    storageOK = true;
  } catch (e) {
    storageOK = false;
    toast('这台设备不让存数据，记录可能丢失');
  }
}
function catById(id) { return db.cats.find(c => c.id === id); }
function activeCats() { return db.cats.filter(c => !c.archived); }

/* ---- 存款 ---- */
function goalById(id) { return db.goals.find(g => g.id === id); }
function goalBalance(id) { return db.saves.filter(s => s.goalId === id).reduce((a, s) => a + s.amt, 0); }
function totalSavings() { return db.saves.reduce((a, s) => a + s.amt, 0); }
function monthSaved(mk) {
  return db.saves.filter(s => s.mk === mk && s.src === 'month' && s.amt > 0).reduce((a, s) => a + s.amt, 0);
}
function monthIn(mk) {
  return db.saves.filter(s => s.mk === mk && s.amt > 0).reduce((a, s) => a + s.amt, 0);
}
function saveableThisMonth() {
  const { v, spent, allocated } = statsOf(CUR_MONTH);
  const pool = v.income > 0 ? v.income : allocated;
  return Math.max(0, pool - spent - monthSaved(CUR_MONTH));
}
function shortDate(ymd) {
  const p = String(ymd || '').split('-').map(Number);
  return p[1] + '月' + p[2] + '日';
}

function lastStoredMonth() {
  const ks = Object.keys(db.months).sort();
  for (let i = ks.length - 1; i >= 0; i--) {
    const m = db.months[ks[i]];
    if (m && (m.income || m.tx.length || Object.keys(m.budget).length)) return ks[i];
  }
  return null;
}
/* 未落库的月份：沿用它之前最近一个月的数据作起点 */
function monthView(mk) {
  const r = db.months[mk];
  if (r) return { income: r.income || 0, budget: r.budget || {}, tx: r.tx || [], isNew: false };
  const prev = lastStoredMonth();
  let income = 0, budget = {};
  if (prev && prev < mk) {
    const p = db.months[prev];
    income = p.income || 0;
    Object.keys(p.budget || {}).forEach(cid => {
      const c = catById(cid);
      if (c && !c.archived) budget[cid] = p.budget[cid];
    });
  }
  return { income, budget, tx: [], isNew: true };
}
function materialize(mk) {
  if (!db.months[mk]) {
    const v = monthView(mk);
    db.months[mk] = { income: v.income, budget: Object.assign({}, v.budget), tx: [] };
  }
  const m = db.months[mk];
  m.income = m.income || 0;
  m.budget = m.budget || {};
  m.tx = m.tx || [];
  return m;
}
function statsOf(mk) {
  const v = monthView(mk);
  const spentBy = {};
  let spent = 0;
  v.tx.forEach(t => {
    spent += t.amt;
    spentBy[t.catId] = (spentBy[t.catId] || 0) + t.amt;
  });
  let allocated = 0;
  Object.keys(v.budget).forEach(k => { allocated += v.budget[k] || 0; });
  return { v, spent, spentBy, allocated };
}
function catsInMonth(mk) {
  const v = monthView(mk);
  const ids = [];
  activeCats().forEach(c => ids.push(c.id));
  Object.keys(v.budget).forEach(id => { if (!ids.includes(id)) ids.push(id); });
  v.tx.forEach(t => { if (!ids.includes(t.catId)) ids.push(t.catId); });
  return ids.map(id => catById(id) || { id, name: '已删除', color: '#9B9D90' });
}

const state = { tab: 'home', billsMonth: CUR_MONTH, wipeArmed: false, importArmed: false };

/* ============ 渲染 ============ */
function render() {
  const view = $('#view');

  else if (state.tab === 'bills') view.innerHTML = viewBills();
  else if (state.tab === 'save') view.innerHTML = viewSave();
  else view.innerHTML = viewSettings();

  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));

  $('#pill').style.visibility = $('#pill').textContent ? 'visible' : 'hidden';

function viewHome() {
  const mk = CUR_MONTH;
  const { v, spent, spentBy, allocated } = statsOf(mk);
  const hasAny = allocated > 0 || v.income > 0 || v.tx.length > 0;

  if (!hasAny) {
    return '' +
      '<div class="empty">' +
        '<h2>这个月还没分份</h2>' +
        '<p>把到手的钱分成几份，每份写明用途。花的时候从对应那份里扣，剩多少一眼就看见。</p>' +
        '<button class="btn primary" data-act="budget">给' + Number(mk.split('-')[1]) + '月分份</button>' +
      '</div>';
  }

  const pool = v.income > 0 ? v.income : allocated;
  const left = pool - spent;
  const usedPct = pool > 0 ? Math.min(100, (spent / pool) * 100) : 100;
  const unalloc = Math.max(0, v.income - allocated);
  const savedM = monthIn(mk);

  const active = activeCats();
  const extra = catsInMonth(mk).filter(c =>
    !active.some(a => a.id === c.id) &&
    ((v.budget[c.id] || 0) !== 0 || (spentBy[c.id] || 0) !== 0)
  );

  const rowFor = (c, live) => {
    const b = v.budget[c.id] || 0;
    const s = spentBy[c.id] || 0;
    const rest = b - s;
    const pct = b > 0 ? Math.min(100, (s / b) * 100) : (s > 0 ? 100 : 0);
    const cls = rest < 0 ? ' over' : (b === 0 ? ' zero' : '');
    const amtTxt = b === 0 && s === 0 ? '未分配' : (rest < 0 ? '-' + fmt(-rest) : fmt(rest));
    const meta = !live ? '已从分份里移除 · 已花 ' + fmt(s)
      : (b > 0 ? '额度 ' + fmt(b) + ' · 已花 ' + fmt(s)
        : (s > 0 ? '额度 0 · 已花 ' + fmt(s) : '还没给这份定数'));
    const inner = '' +
      '<span class="pk-top">' +
        '<span>' +
          '<span class="pk-name">' + esc(c.name) + '</span>' +
          '<span class="pk-meta">' + meta + '</span>' +
        '</span>' +
        '<span class="pk-amt' + cls + '">' + amtTxt + '</span>' +
      '</span>' +
      '<span class="pk-bar"><i class="' + (rest < 0 ? 'over' : '') + '" style="width:' + pct + '%"></i></span>';
    return live
      ? '<button class="pocket" data-act="log" data-cat="' + c.id + '" style="--c:' + esc2(c.color) + '">' + inner + '</button>'
      : '<div class="pocket gone" style="--c:' + esc2(c.color) + '">' + inner + '</div>';
  };

  let pockets = active.map(c => rowFor(c, true)).join('') + extra.map(c => rowFor(c, false)).join('');

  if (!pockets) {
    pockets = '<div class="blank">还没有分类。去「我的 → 修改本月分份」加几个。</div>';
  }

  return '' +
    '<section class="hero">' +
      '<div class="hero-k">' + (v.income > 0 ? '本月可用' : '预算剩余') + '</div>' +
      '<div class="hero-num' + (left < 0 ? ' neg' : '') + '">' +
        '<span class="cur">¥</span>' + fmt(Math.abs(left)).replace(/\.(\d+)$/, '<span class="dec">.$1</span>') +
      '</div>' +
      '<div class="bar"><i style="width:' + usedPct + '%"></i></div>' +
      '<div class="hero-foot">' +
        '<span>已花 <b>¥' + fmt(spent) + '</b></span>' +
        '<span>' + (v.income > 0 ? '收入 ' : '额度 ') + '<b>¥' + fmt(pool) + '</b></span>' +
      '</div>' +
    '</section>' +
    (unalloc > 0 ? '<button class="hint" data-act="budget">还有 <b>¥' + fmt(unalloc) + '</b> 没分出去 · 去分配</button>' : '') +
    '<div class="sec-h"><h2>分了几份</h2><button class="link" data-act="budget">调整</button></div>' +
    pockets +
    (savedM > 0 ? '<button class="savedline" data-act="tab" data-tab="save">本月已存 <b>¥' + fmt(savedM) + '</b> · 查看存款</button>' : '');
}

function viewBills() {

        return '<div class="lr" style="--c:' + esc2(c.color) + '">' +

  const byDay = {};

          '<span class="tx-d"></span>' +
          '<span><span class="tx-n">' + esc(note || c.name) + '</span>' +
            (note ? '<span class="tx-c">' + esc(c.name) + '</span>' : '') + '</span>' +
          '<span class="tx-a">-¥' + fmt(t.amt) + '</span>' +
        '</button>';
      }).join('');
  }).join('') : '<div class="blank">' + (allocated || income ? '这个月还没有支出记录。' : '这个月还没有记录。') + '</div>';

  return '' +
    '<div class="mnav">' +
      '<button data-act="mstep" data-d="-1" aria-label="上个月">‹</button>' +
      '<div class="mnav-t">' + monthLabel(mk) + '</div>' +
      '<button data-act="mstep" data-d="1" aria-label="下个月"' + (isCur ? ' disabled' : '') + '>›</button>' +
    '</div>' +
    '<div class="sum">' +
      '<div><span class="sum-k">收入</span><span class="sum-v">' + fmt(income) + '</span></div>' +
      '<div><span class="sum-k">支出</span><span class="sum-v">' + fmt(spent) + '</span></div>' +
      '<div><span class="sum-k">结余</span><span class="sum-v' + (left < 0 ? ' neg' : '') + '">' + fmt(left) + '</span></div>' +
    '</div>' +
    ledgerHTML +
    '<div class="sec-h"><h2>明细</h2><span class="pill">' + v.tx.length + ' 笔</span></div>' +

}

function openDepositSheet(goalId, fromMonth) {
  const goals = db.goals.filter(g => !g.archived);
  if (!goals.length) {
    openGoalSheet(null, id => openDepositSheet(id, fromMonth));
    return;
  }

  let sel = goals.some(g => g.id === goalId) ? goalId : goals[0].id;
  let dir = 'in';

  const { v, spent, allocated } = statsOf(CUR_MONTH);
  const pool = v.income > 0 ? v.income : allocated;
  const leftAll = Math.max(0, pool - spent);
  const unalloc = Math.max(0, v.income - allocated);
  const remainSum = allocated - spent;

  const amounts = [];
  [{ k: '本月可用', v: leftAll }, { k: '没分配', v: unalloc }, { k: '各类剩余', v: remainSum }].forEach(x => {
    if (x.v > 0 && !amounts.some(a => a.v === x.v)) amounts.push(x);
  });

  const html = '' +
    '<div class="grab"></div>' +
    '<h3 class="sheet-t" id="dpTitle">存入</h3>' +
    '<div class="seg2" id="dir">' +
      '<button data-dir="in" class="on">存入</button><button data-dir="out">取出</button>' +
    '</div>' +
    '<div class="amount"><span class="cur">¥</span>' +
      '<input id="amt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="' +
        (fromMonth ? fmt(Math.max(0, leftAll - monthSaved(CUR_MONTH))) : '') + '">' +
    '</div>' +
    '<div class="quick" id="quick">' + amounts.map(x =>
      '<button class="qchip" data-fill="' + x.v + '">' + x.k + ' <b>¥' + fmt(x.v) + '</b></button>'
    ).join('') + '</div>' +
    '<div class="sec-h" style="margin:18px 0 10px"><h2>存到</h2></div>' +
    '<div class="chips" id="gchips">' + goals.map(g =>
      '<button class="chip' + (g.id === sel ? ' on' : '') + '" data-gid="' + g.id + '" style="--c:' + esc2(g.color) + '"><span class="d"></span>' + esc(g.name) + '</button>'
    ).join('') + '</div>' +
    '<input class="field" id="note" maxlength="24" placeholder="备注（比如：11月奖金）" value="' + esc(fromMonth ? '本月没花完的' : '') + '">' +
    '<label class="daterow"><span>日期</span><input type="date" id="date" value="' + TODAY + '" max="' + TODAY + '"></label>' +
    '<button class="btn primary" id="go" style="margin-top:20px">存入</button>' +
    '<button class="linkbtn" id="editGoal">修改这个目标</button>';

  openSheet(html, root => {
    const amtEl = $('#amt', root);
    const quickEl = $('#quick', root);
    const goBtn = $('#go', root);

    setTimeout(() => { try { amtEl.focus(); } catch (e) {} }, 240);

    const setDir = d => {
      dir = d;
      $$('#dir button', root).forEach(b => b.classList.toggle('on', b.dataset.dir === d));
      $('#dpTitle', root).textContent = d === 'in' ? '存入' : '取出';
      goBtn.textContent = d === 'in' ? '存入' : '取出';
      quickEl.style.display = d === 'in' ? '' : 'none';
      goBtn.classList.toggle('primary', d === 'in');
      goBtn.classList.toggle('danger', d === 'out');
    };

    $('#dir', root).addEventListener('click', e => {
      const b = e.target.closest('button[data-dir]');
      if (b) setDir(b.dataset.dir);
    });

    quickEl.addEventListener('click', e => {
      const b = e.target.closest('[data-fill]');
      if (!b) return;
      amtEl.value = fmt(Number(b.dataset.fill));
      amtEl.focus();
    });

    $('#gchips', root).addEventListener('click', e => {
      const b = e.target.closest('.chip');
      if (!b) return;
      sel = b.dataset.gid;
      $$('.chip', $('#gchips', root)).forEach(x => x.classList.toggle('on', x === b));
    });

    $('#editGoal', root).addEventListener('click', () => {
      openGoalSheet(sel, () => openDepositSheet(sel, false));
    });

    goBtn.addEventListener('click', () => {
      const amt = parseMoney(amtEl.value);
      if (amt <= 0) { amtEl.focus(); toast('先填个金额'); return; }
      if (dir === 'out' && amt > goalBalance(sel)) { toast('这个目标里只有 ¥' + fmt(goalBalance(sel))); return; }

      const ymd = ($('#date', root).value || TODAY).slice(0, 10);
      db.saves.push({
        id: uid('s'),
        goalId: sel,
        amt: dir === 'in' ? amt : -amt,
        ymd,
        note: ($('#note', root).value || '').trim().slice(0, 24),
        ts: Date.now(),
        mk: ymd.slice(0, 7),
        src: (dir === 'in' && fromMonth) ? 'month' : 'manual'
      });
      saveDB();
      closeSheet();
      state.tab = 'save';
      render();
      const g = goalById(sel);
      toast((dir === 'in' ? '已存入 ¥' : '已取出 ¥') + fmt(amt) + (g ? ' · ' + g.name : ''));
    });
  });
}

        g.name = name; g.target = target; g.color = color;
      } else {
        const ng = { id: uid('g'), name, color, target, archived: false };
        db.goals.push(ng);
        newId = ng.id;
      }
      saveDB(); closeSheet(); state.tab = 'save'; render(); toast('已保存');
      if (cb) cb(newId);
    });

    const del = $('#delGoal', root);
    if (del) del.addEventListener('click', () => {
      const bal = goalBalance(g.id);
      if (bal !== 0) {
        toast(bal > 0 ? '里面还有 ¥' + fmt(bal) + '，先取出再删' : '这个目标余额是负的，先补平再删');
        return;
      }
      const used = db.saves.some(s => s.goalId === g.id);
      if (used) g.archived = true;
      else db.goals = db.goals.filter(x => x.id !== g.id);
      saveDB(); closeSheet(); state.tab = 'save'; render();
      toast(used ? '已删除，存取记录保留' : '已删除');
    });
  });
}

/* ============ 浮层 ============ */
let sheetEl, layerEl, openedAt = 0;

function syncViewport() {
  const vv = window.visualViewport;
  if (!vv || !layerEl) return;
  layerEl.style.height = vv.height + 'px';
  layerEl.style.top = vv.offsetTop + 'px';
}

function openSheet(html, onMount) {
  layerEl = layerEl || $('#layer');
  sheetEl = sheetEl || $('#sheet');
  $('#layer').hidden = false;
  $('#sheet').innerHTML = html;
  syncViewport();
  void $('#sheet').offsetHeight;
  $('#layer').classList.add('open');
  openedAt = Date.now();
  document.documentElement.style.overflow = 'hidden';
  if (onMount) onMount($('#sheet'));
}

function closeSheet() {
  const layer = $('#layer');
  if (!layer || layer.hidden) return;
  layer.classList.remove('open');
  document.documentElement.style.overflow = '';
  setTimeout(() => {
    if (!layer.classList.contains('open')) {
      layer.hidden = true;
      $('#sheet').innerHTML = '';
    }
  }, 260);
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncViewport);
  window.visualViewport.addEventListener('scroll', syncViewport);
}
window.addEventListener('resize', syncViewport);

/* ============ 记账 ============ */
function openLogSheet(catId) {
  const cats = activeCats();
  if (!cats.length) {
    toast('先加一个分类');
    openBudgetSheet();
    return;
  }
  let sel = cats.some(c => c.id === catId) ? catId : cats[0].id;

  const html = '' +
    '<div class="grab"></div>' +
    '<h3 class="sheet-t">记一笔</h3>' +
    '<div class="amount"><span class="cur">¥</span><input id="amt" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0.00" aria-label="金额"></div>' +
    '<div class="chips" id="chips">' + cats.map(c =>
      '<button class="chip' + (c.id === sel ? ' on' : '') + '" data-cid="' + c.id + '" style="--c:' + esc2(c.color) + '"><span class="d"></span>' + esc(c.name) + '</button>'
    ).join('') + '</div>' +
    '<input class="field" id="note" placeholder="备注（可不填）" maxlength="30" autocomplete="off">' +
    '<label class="daterow"><span>日期</span><input type="date" id="date" value="' + TODAY + '" max="' + TODAY + '"></label>' +
    '<button class="btn primary" id="saveTx" style="margin-top:20px">记上</button>';

  openSheet(html, root => {
    const amtEl = $('#amt', root);
    const chips = $('#chips', root);

    chips.addEventListener('click', e => {
      const b = e.target.closest('.chip');
      if (!b) return;
      sel = b.dataset.cid;
      $$('.chip', chips).forEach(x => x.classList.toggle('on', x === b));
    });

    setTimeout(() => { try { amtEl.focus(); } catch (e) {} }, 240);

    const commit = () => {
      const amt = parseMoney(amtEl.value);
      if (amt <= 0) {
        amtEl.focus();
        toast('先填个金额');
        return;
      }
      const dEl = $('#date', root);
      const ymd = (dEl.value || TODAY).slice(0, 10);
      const txMonth = ymd.slice(0, 7);
      const m = materialize(txMonth);
      const note = ($('#note', root).value || '').trim().slice(0, 30);
      m.tx.push({ id: uid('t'), catId: sel, amt, note, ymd, ts: Date.now() });
      saveDB();
      closeSheet();
      render();

      const c = catById(sel);
      const b = monthView(txMonth).budget[sel] || 0;
      const s = m.tx.filter(t => t.catId === sel).reduce((a, t) => a + t.amt, 0);
      const rest = b - s;
      let msg = '已记 ¥' + fmt(amt) + (c ? ' · ' + c.name : '');
      if (b > 0) msg += rest < 0 ? '，超了 ¥' + fmt(-rest) : '，还剩 ¥' + fmt(rest);
      toast(msg);
    };

    $('#saveTx', root).addEventListener('click', commit);
    amtEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
  });
}

/* ============ 分份（预算） ============ */
function openBudgetSheet() {
  const mk = CUR_MONTH;
  const v = monthView(mk);
  const label = monthLabel(mk);
  let rows = activeCats().map(c => ({
    key: c.id,
    id: c.id,
    name: c.name,
    color: c.color,
    amt: v.budget[c.id] || 0
  }));
  let seq = 0;

  const html = '' +
    '<div class="grab"></div>' +
    '<h3 class="sheet-t">' + label + ' 分份</h3>' +
    '<p class="sheet-sub">钱到手后先分好，每一份花完为止。' + (v.isNew && rows.length ? '已按上个月带过来，直接改数字就行。' : '') + '</p>' +
    '<label class="income"><span>本月收入</span><span class="wrap">' +
      '<input id="income" inputmode="decimal" autocomplete="off" placeholder="0" value="' + (v.income ? fmt(v.income) : '') + '"></span></label>' +
    '<div class="sec-h" style="margin:20px 0 4px"><h2>分成几份</h2></div>' +
    '<div id="rows"></div>' +
    '<button class="add-cat" id="addCat">＋ 添加一类</button>' +
    '<div class="alloc" id="alloc"></div>' +
    '<button class="btn primary" id="saveBudget" style="margin-top:12px">保存</button>' +
    '<p class="note" style="margin:12px 0 0">收入减去各份的额度，剩下的就是没安排的钱（比如要存起来的）。</p>';

  function rowsHTML() {
    if (!rows.length) return '<div class="blank" style="padding:20px 0;border-bottom:1px solid var(--line2)">还没有分类，点下面加一个。</div>';
    return rows.map((r, i) => '' +
      '<div class="brow" data-key="' + r.key + '">' +
        '<button class="dot" data-i="' + i + '" style="--c:' + esc2(r.color) + '" aria-label="换个颜色"></button>' +
        '<input class="bname" value="' + esc(r.name) + '" placeholder="分类名" maxlength="8">' +
        '<span class="bamt"><input class="bval" inputmode="decimal" value="' + (r.amt ? fmt(r.amt) : '') + '" placeholder="0"></span>' +
        '<button class="bdel" aria-label="删掉这类">×</button>' +
      '</div>').join('');
  }

  function updateAlloc(root) {
    const inc = parseMoney($('#income', root).value);
    const sum = rows.reduce((a, r) => a + r.amt, 0);
    const diff = inc - sum;
    const el = $('#alloc', root);
    el.innerHTML = '<span>已分配 <b>¥' + fmt(sum) + '</b></span>' +
      (inc > 0
        ? '<span>' + (diff < 0 ? '超出收入 <b class="over">¥' + fmt(-diff) + '</b>' : '没安排 <b>¥' + fmt(diff) + '</b>') + '</span>'
        : '<span></span>');
  }

  openSheet(html, root => {
    const rowsEl = $('#rows', root);
    const paint = () => { rowsEl.innerHTML = rowsHTML(); updateAlloc(root); };
    paint();

    rowsEl.addEventListener('input', e => {
      const rowEl = e.target.closest('.brow');
      if (!rowEl) return;
      const r = rows.find(x => x.key === rowEl.dataset.key);
      if (!r) return;
      if (e.target.classList.contains('bname')) r.name = e.target.value;
      else if (e.target.classList.contains('bval')) r.amt = parseMoney(e.target.value);
      updateAlloc(root);
    });

    rowsEl.addEventListener('click', e => {
      const rowEl = e.target.closest('.brow');
      if (!rowEl) return;
      const idx = rows.findIndex(x => x.key === rowEl.dataset.key);
      if (idx < 0) return;
      if (e.target.classList.contains('dot')) {
        const cur = PALETTE.indexOf(rows[idx].color);
        rows[idx].color = PALETTE[(cur + 1) % PALETTE.length];
        e.target.style.setProperty('--c', rows[idx].color);
      } else if (e.target.classList.contains('bdel')) {
        rows.splice(idx, 1);
        paint();
      }
    });

    $('#income', root).addEventListener('input', () => updateAlloc(root));

    $('#addCat', root).addEventListener('click', () => {
      seq++;
      rows.push({
        key: 'new' + seq,
        id: null,
        name: '',
        color: PALETTE[(rows.length + 2) % PALETTE.length],
        amt: 0
      });
      paint();
      const inputs = $$('.bname', rowsEl);
      const last = inputs[inputs.length - 1];
      if (last) { last.focus(); last.select(); }
    });

    $('#saveBudget', root).addEventListener('click', () => {
      const income = parseMoney($('#income', root).value);
      const shownIds = activeCats().map(c => c.id);
      const keptIds = rows.filter(r => r.id).map(r => r.id);

      rows.forEach(r => {
        const name = (r.name || '').trim();
        if (!name && !r.amt) return;
        if (r.id) {
          const c = catById(r.id);
          if (c) { c.name = name || c.name; c.color = r.color; }
        } else {
          if (!name) return;
          const nc = { id: uid('c'), name, color: r.color, archived: false };
          db.cats.push(nc);
          r.id = nc.id;
        }
      });

      const m = materialize(mk);
      m.income = income;
      m.budget = {};
      rows.forEach(r => { if (r.id) m.budget[r.id] = r.amt || 0; });

      // 被移掉的分类：有记录就归档，没记录就删掉
      const removed = shownIds.filter(id => !keptIds.includes(id) && !rows.some(r => r.id === id));
      removed.forEach(id => {
        const used = Object.keys(db.months).some(k => (db.months[k].tx || []).some(t => t.catId === id));
        const c = catById(id);
        if (!c) return;
        if (used) {
          c.archived = true;
        } else {
          db.cats = db.cats.filter(x => x.id !== id);
          Object.keys(db.months).forEach(k => { delete db.months[k].budget[id]; });
        }
      });

      saveDB();
      closeSheet();
      state.tab = 'home';
      render();
      toast('已保存');
    });
  });
}

/* ============ 单笔详情 ============ */
function openTxSheet(mk, id) {
  const m = db.months[mk];
  if (!m) return;
  const t = m.tx.find(x => x.id === id);
  if (!t) return;
  const c = catById(t.catId) || { name: '已删除', color: '#9B9D90' };

  const html = '' +
    '<div class="grab"></div>' +
    '<h3 class="sheet-t">' + esc((t.note || '').trim() || c.name) + '</h3>' +
    '<p class="sheet-sub">' + dayLabel(t.ymd) + ' · ' + esc(c.name) + '</p>' +
    '<div class="amount" style="border-color:var(--line);margin-bottom:18px"><span class="cur">¥</span>' +
      '<div style="font-family:var(--serif);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums">' + fmt(t.amt) + '</div></div>' +
    '<button class="btn danger" id="delTx">删除这笔</button>';

  openSheet(html, root => {
    $('#delTx', root).addEventListener('click', () => {
      m.tx = m.tx.filter(x => x.id !== id);
      saveDB();
      closeSheet();
      render();
      toast('已删除');
    });
  });
}

/* ============ 备份 ============ */
function openExportSheet() {
  const payload = { app: '月钱', v: 2, exportedAt: new Date().toISOString(), cats: db.cats, months: db.months, goals: db.goals, saves: db.saves };
  const json = JSON.stringify(payload);
  const html = '' +
    '<div class="grab"></div>' +
    '<h3 class="sheet-t">导出备份</h3>' +
    '<p class="sheet-sub">把下面这段存到微信收藏或备忘录，换手机时用「导入备份」贴回来。</p>' +
    '<textarea class="code" id="exp" readonly>' + esc(json) + '</textarea>' +
    '<div class="btnrow"><button class="btn" id="copyBtn">复制</button>' +
    '<button class="btn primary" id="dlBtn">存成文件</button></div>';

  openSheet(html, root => {
    const ta = $('#exp', root);
    $('#copyBtn', root).addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(json);
        toast('已复制');
      } catch (e) {
        ta.select();
        ta.setSelectionRange(0, json.length);
        try { document.execCommand('copy'); toast('已复制'); }
        catch (err) { toast('复制失败，请长按文字手动复制'); }
      }
    });
    $('#dlBtn', root).addEventListener('click', () => {
      try {
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '月钱备份-' + TODAY + '.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
      } catch (e) {
        toast('这台设备不支持下载，用复制吧');
      }
    });
  });
}

function openImportSheet() {
  const html = '' +
    '<div class="grab"></div>' +
    '<h3 class="sheet-t">导入备份</h3>' +
    '<p class="sheet-sub">把之前导出的那段文字整段贴进来。</p>' +
    '<textarea class="code" id="imp" placeholder="粘贴备份内容"></textarea>' +
    '<button class="btn primary" id="impBtn">导入</button>' +
    '<p class="warn" id="impWarn" hidden></p>';

  openSheet(html, root => {
    let armed = false;
    const btn = $('#impBtn', root);
    const warn = $('#impWarn', root);
    btn.addEventListener('click', () => {
      let parsed = null;
      try {
        parsed = JSON.parse($('#imp', root).value.trim());
      } catch (e) {
        warn.hidden = false;
        warn.textContent = '这段内容读不出来，确认是完整的备份文字。';
        return;
      }
      if (!parsed || !Array.isArray(parsed.cats) || typeof parsed.months !== 'object' || !parsed.months) {
        warn.hidden = false;
        warn.textContent = '格式不对，备份里应该有分类和月份数据。';
        return;
      }
      if (!armed) {
        armed = true;
        btn.textContent = '确认覆盖现有数据';
        btn.classList.add('danger');
        btn.classList.remove('primary');
        warn.hidden = false;
        warn.textContent = '导入会替换这台设备上现在的全部记录，再点一次确认。';
        return;
      }
      db = {
        cats: parsed.cats,
        months: parsed.months,
        goals: Array.isArray(parsed.goals) ? parsed.goals : [],
        saves: Array.isArray(parsed.saves) ? parsed.saves : []
      };
      normalizeDB();
      saveDB();
      closeSheet();
      state.billsMonth = CUR_MONTH;
      render();
      toast('导入完成');
    });
  });
}

/* ============ 交互 ============ */
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function switchTab(tab) {
  if (!['home', 'bills', 'save', 'settings'].includes(tab)) return;
  state.tab = tab;
  if (tab === 'bills' && !state.billsMonth) state.billsMonth = CUR_MONTH;
  window.scrollTo({ top: 0, behavior: 'auto' });
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'tab') { switchTab(el.dataset.tab); return; }
  if (act === 'close') { closeSheet(); return; }

  if (act === 'log') {
    e.preventDefault();
    openLogSheet(el.dataset.cat || '');
    return;
  }
  if (act === 'budget') { openBudgetSheet(); return; }
  if (act === 'tx') { openTxSheet(el.dataset.mk, el.dataset.id); return; }

  if (act === 'saveLeft') { openDepositSheet(null, true); return; }
  if (act === 'deposit') { openDepositSheet(el.dataset.goal || null, false); return; }
  if (act === 'newGoal') { openGoalSheet(null); return; }

  if (act === 'mstep') {
    const d = Number(el.dataset.d);
    const [y, mo] = state.billsMonth.split('-').map(Number);
    const dt = new Date(y, mo - 1 + d, 1);
    const next = monthOf(dt);
    if (next > CUR_MONTH) return;
    state.billsMonth = next;
    render();
    return;
  }

  if (act === 'export') { openExportSheet(); return; }
  if (act === 'import') { openImportSheet(); return; }

  if (act === 'wipe') {
    if (!state.wipeArmed) {
      state.wipeArmed = true;
      render();
      setTimeout(() => { state.wipeArmed = false; if (state.tab === 'settings') render(); }, 4000);
      return;
    }
    db = { cats: seedCats(), months: {}, goals: [], saves: [] };
    try { localStorage.removeItem(STORE_KEY); } catch (err) {}
    saveDB();
    state.wipeArmed = false;
    state.billsMonth = CUR_MONTH;
    render();
    toast('已清空');
    return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
});

$('#logBtn').addEventListener('click', () => openLogSheet(''));

/* ============ 启动 ============ */
loadDB();
render();
window.addEventListener('pageshow', () => { if (!document.getElementById('layer').hidden) syncViewport(); });
</script>
